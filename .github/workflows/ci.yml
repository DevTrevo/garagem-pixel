name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: python3 build.py dist/garagem-pixel.html
      - run: npm test
      - run: npm install
      - run: npx playwright install --with-deps chromium
      - run: |
          node tests/e2e/flow3.js "$PWD/dist"
          node tests/e2e/flow_racha.js "$PWD/dist"
          node tests/e2e/editor.js "$PWD/dist"
      - uses: actions/upload-artifact@v4
        with:
          name: garagem-pixel
          path: dist/garagem-pixel.html
